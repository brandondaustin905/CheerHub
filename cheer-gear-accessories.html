<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheer Gear & Accessories | The Cheer Hub</title>
<style>
  :root {
    --navy: #0f1c3f;
    --red: #c41a22;
    --gold: #facc15;
    --ink: #14213d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #150a1f;
    color: #1c2333;
  }
  .hero {
    background: linear-gradient(160deg, var(--red) 0%, var(--navy) 100%);
    padding: 70px 8vw 60px 8vw;
    position: relative;
    overflow: hidden;
    border-bottom: 10px solid var(--gold);
  }
  .hero::before, .hero::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .hero::before { width: 340px; height: 340px; right: -80px; top: -100px; }
  .hero::after { width: 220px; height: 220px; right: 220px; bottom: -120px; }
  .hero h1 {
    color: #fff;
    font-size: clamp(2rem, 5vw, 3.4rem);
    margin: 0 0 14px 0;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  .hero p.sub {
    color: #f0f2f8;
    font-size: 1.15rem;
    max-width: 640px;
    margin: 0;
  }
  main {
    background: #f7f8fb;
    padding: 50px 8vw 90px 8vw;
  }
  .intro-card {
    background: #fff;
    border: 1px solid #dde2ee;
    border-left: 6px solid var(--red);
    border-radius: 14px;
    padding: 26px 30px;
    margin: -46px auto 46px auto;
    max-width: 980px;
    box-shadow: 0 12px 30px rgba(15,28,63,0.12);
  }
  .intro-card h2 {
    margin-top: 0;
    color: var(--navy);
    font-size: 1.2rem;
  }
  .intro-card ul { margin: 10px 0 0 0; padding-left: 22px; color: #3a4258; line-height: 1.6; }
  h2.section-title {
    color: var(--navy);
    font-size: 1.5rem;
    border-bottom: 3px solid var(--gold);
    display: inline-block;
    padding-bottom: 6px;
    margin: 46px 0 22px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 22px 24px;
    box-shadow: 0 6px 18px rgba(15,28,63,0.08);
    border-top: 5px solid var(--red);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:nth-child(3n+2) { border-top-color: var(--navy); }
  .card:nth-child(3n+3) { border-top-color: var(--gold); }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 26px rgba(15,28,63,0.16);
  }
  .card h3 { margin: 0 0 8px 0; color: #14213d; font-size: 1.08rem; }
  .card a.site-link {
    display: inline-block;
    font-weight: 600;
    color: var(--red);
    text-decoration: none;
    margin-bottom: 10px;
    word-break: break-word;
  }
  .card a.site-link:hover { text-decoration: underline; color: var(--navy); }
  .card p { margin: 0; color: #3a4258; font-size: 0.94rem; line-height: 1.5; }
  .badge {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #145c2c;
    background: #e3f7e9;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .badge.neutral {
    color: #7a5b00;
    background: #fff4d6;
  }
  details {
    margin-top: 12px;
    border-top: 1px dashed #dde2ee;
    padding-top: 10px;
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--navy);
    font-size: 0.88rem;
    outline: none;
  }
  details summary:hover { color: var(--red); }
  .reviews-box {
    margin-top: 8px;
    font-size: 0.86rem;
    color: #3a4258;
    line-height: 1.5;
  }
  .reviews-box a {
    display: inline-block;
    margin-top: 4px;
    color: var(--red);
    text-decoration: none;
    font-weight: 600;
  }
  .reviews-box a:hover { text-decoration: underline; }
