<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency Contact Card | Survival Kit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <h1>🏥 Emergency Contact Card</h1>
  <p>Fill this in once, then print it and keep it in your competition bag.</p>
</div>

<main>
  <div class="tool-header no-print">
    <div class="btn-row">
      <button class="btn" onclick="window.print()">🖨️ Print This Card</button>
      <button class="btn secondary" onclick="resetCard()">↺ Clear All</button>
    </div>
  </div>

  <div class="card" id="printCard">
    <h2>Athlete & Emergency Information</h2>
    <div class="two-col">
      <div class="form-field"><label>Athlete Name</label><input type="text" id="f_name"></div>
      <div class="form-field"><label>Date of Birth</label><input type="text" id="f_dob"></div>
    </div>
    <div class="form-field"><label>Allergies</label><input type="text" id="f_allergies"></div>
    <div class="two-col">
      <div class="form-field"><label>Emergency Contact (1) — Name</label><input type="text" id="f_ec1name"></div>
      <div class="form-field"><label>Emergency Contact (1) — Phone</label><input type="text" id="f_ec1phone"></div>
    </div>
    <div class="two-col">
      <div class="form-field"><label>Emergency Contact (2) — Name</label><input type="text" id="f_ec2name"></div>
      <div class="form-field"><label>Emergency Contact (2) — Phone</label><input type="text" id="f_ec2phone"></div>
    </div>
    <div class="form-field"><label>Primary Physician</label><input type="text" id="f_physician"></div>
    <div class="form-field"><label>Health Insurance Provider & Policy #</label><input type="text" id="f_insurance"></div>
    <div class="form-field"><label>Nearest Emergency Room</label><input type="text" id="f_er"></div>
    <div class="form-field"><label>Medical Conditions / Notes</label><textarea rows="3" id="f_notes"></textarea></div>
    <p class="save-status" id="saveStatus">Changes save automatically in this browser.</p>
  </div>
</main>

<footer>The Cheer Hub — Ultimate Competition Survival Kit</footer>

<script src="nav.js"></script>
<script>
renderNav("emergency-contact.html");

const FIELDS = ["f_name","f_dob","f_allergies","f_ec1name","f_ec1phone","f_ec2name","f_ec2phone","f_physician","f_insurance","f_er","f_notes"];
const statusEl = document.getElementById("saveStatus");
FIELDS.forEach(id => {
  const el = document.getElementById(id);
  bindAutoSave(el, "emergency_" + id);
  el.addEventListener("input", () => flashSaved(statusEl));
});

function resetCard() {
  if (!confirm("Clear the emergency contact card?")) return;
  FIELDS.forEach(id => { localStorage.removeItem("survivalKit_emergency_" + id); document.getElementById(id).value = ""; });
}
</script>
</body>
</html>
