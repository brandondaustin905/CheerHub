<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Checklist | Survival Kit</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="hero">
  <h1>✅ Weekly Checklist & Reflection</h1>
  <p>Your prep checklist and reflection questions for this competition weekend.</p>
</div>

<main>
  <div class="tool-header no-print">
    <div class="btn-row">
      <button class="btn" onclick="window.print()">🖨️ Print</button>
      <button class="btn secondary" onclick="resetWeekly()">↺ Start Fresh for Next Competition</button>
    </div>
  </div>

  <div class="card">
    <h2>This Competition</h2>
    <div class="form-field">
      <label>Competition / Date</label>
      <input type="text" id="compName" placeholder="e.g. Winter Classic — Jan 18">
    </div>
  </div>

  <div class="card">
    <h2>Checklist</h2>
    <div id="weeklyList"></div>
    <p class="save-status" id="saveStatus1">Changes save automatically in this browser.</p>
  </div>

  <div class="card">
    <h2>Reflection</h2>
    <div class="form-field">
      <label>Favorite moment today?</label>
      <textarea rows="2" id="q1"></textarea>
    </div>
    <div class="form-field">
      <label>Skill/routine to improve next time?</label>
      <textarea rows="2" id="q2"></textarea>
    </div>
    <div class="form-field">
      <label>How did I support my teammates?</label>
      <textarea rows="2" id="q3"></textarea>
    </div>
    <p class="save-status" id="saveStatus2">Changes save automatically in this browser.</p>
  </div>
</main>

<footer>The Cheer Hub — Ultimate Competition Survival Kit</footer>

<script src="nav.js"></script>
<script>
renderNav("weekly-checklist.html");

const ITEMS = [
  "Complete budget tracker",
  "Pack gear using checklist",
  "Prep meals & snacks for all travel days",
  "Run through pre-competition routine with athlete",
  "Implement stress-reduction strategies before & after performances",
];

const list = document.getElementById("weeklyList");
const status1 = document.getElementById("saveStatus1");
const status2 = document.getElementById("saveStatus2");

function makeItem(text, done) {
  const row = document.createElement("div");
  row.className = "checklist-item" + (done ? " done" : "");
  row.innerHTML = `<input type="checkbox" ${done ? "checked" : ""}><span class="step-text">${text}</span>`;
  list.appendChild(row);
  const cb = row.querySelector("input");
  cb.addEventListener("change", () => { row.classList.toggle("done", cb.checked); saveChecklist(); });
}

function saveChecklist() {
  const data = [...list.children].map((row,i) => ({
    text: ITEMS[i],
    done: row.querySelector("input").checked,
  }));
  localStorage.setItem("survivalKit_weekly_checklist", JSON.stringify(data));
  flashSaved(status1);
}

const savedChecklist = JSON.parse(localStorage.getItem("survivalKit_weekly_checklist") || "null");
if (savedChecklist) {
  savedChecklist.forEach(r => makeItem(r.text, r.done));
} else {
  ITEMS.forEach(t => makeItem(t, false));
}

bindAutoSave(document.getElementById("compName"), "weekly_compName");
["q1","q2","q3"].forEach(id => bindAutoSave(document.getElementById(id), "weekly_" + id));
[document.getElementById("compName"), document.getElementById("q1"), document.getElementById("q2"), document.getElementById("q3")]
  .forEach(el => el.addEventListener("input", () => flashSaved(status2)));

function resetWeekly() {
  if (!confirm("Start fresh? This clears the competition name, checklist, and reflection answers.")) return;
  ["survivalKit_weekly_checklist","survivalKit_weekly_compName","survivalKit_weekly_q1","survivalKit_weekly_q2","survivalKit_weekly_q3"]
    .forEach(k => localStorage.removeItem(k));
  location.reload();
}
</script>
</body>
</html>
